name: CI

# The harness's own deterministic gate. The guard tests include the matcher-wiring
# assertion (settings.json's PreToolUse matcher must route every tool guard.sh
# handles) — that assertion exists because the guard was once silently dead while
# its unit tests stayed green. See .claude/DESIGN-NOTES.md §"the guard was
# silently dead". Do not remove this job when adapting the template.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is load-bearing — check-tasks-consistency.sh rule 3 (#69,
      # the done-but-unchecked drift gate) walks `git log` for task-bearing commit
      # subjects. actions/checkout fetches ONE commit by default; on a pull_request
      # that commit is the merge commit ("Merge pull request ..."), so rule 3 would
      # see no [T###] and pass vacuously — the gate silently dead in CI (the
      # DESIGN-NOTES §"the guard was silently dead" class). The drift test's
      # CI-wiring assertion FAILs if this is dropped.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Guard hook regression tests (bash + git only, <1s). Now also covers the
      # [edit guard] (guard.sh rule 7, PostToolUse): the delta-based reject (a
      # pre-existing failure stays editable, a new diagnostic is rejected) and the
      # PostToolUse matcher-wiring assertion enumerating the edit tools (#79).
      - name: Guard hook tests
        run: bash .claude/hooks/guard.test.sh

      # Shell-portability lint (#97) + the [edit guard]'s checker (#79, T607).
      # shell-lint.sh is BOTH the checker guard.sh rule 7 runs on a touched *.sh
      # file AND a standing gate over the repo's own hooks: the yes-dash-arg /
      # awk-interval denylist catches BSD-vs-GNU divergences that pass on macOS
      # (dev) and fail on GNU (CI) or vice-versa — the passes-locally-fails-CI
      # class (PR #94, fixed in 981e04c). The .test.sh proves the denylist FIRES
      # on planted patterns and does NOT false-fire on the portable forms (the P2
      # "machinery proves it is live" discipline, same as guard.test.sh). This is
      # adapter-side wiring (hooks/ is the Claude Code binding), not a workflow/**
      # change — no constitution P1 concern.
      - name: Shell-portability lint (hooks)
        run: bash .claude/hooks/shell-lint.sh .claude/hooks/*.sh

      # The launcher templates in docs/launchers/ are adapter machinery too: the
      # [scheduled run] entry (.claude/README.md role table) is docs/launchers/
      # backlog-loop.sh, NOT a sample-only file, so it earns the SAME standing
      # portability gate as the hooks instead of only ad-hoc linting when touched
      # (PR #239 review). *.sh only — the .ps1 sibling is PowerShell.
      - name: Shell-portability lint (launchers)
        run: bash .claude/hooks/shell-lint.sh docs/launchers/*.sh

      - name: Shell-portability lint tests
        run: bash .claude/hooks/shell-lint.test.sh

      # #122 review hardening: the shared runtime-neutrality scanner is a real
      # library now, so pin its API contract directly instead of only through
      # transitive docs tests. The coverage test scans every tracked
      # workflow/**.md file through that shared banned-token set, so a new
      # neutral doc cannot forget to opt in.
      - name: Runtime-neutrality scanner tests
        run: bash .claude/hooks/lib-neutrality-scan.test.sh

      - name: Workflow neutrality scan coverage
        run: bash .claude/hooks/neutrality-scan-coverage.test.sh

      # T617 Omnigent-adapter neutral-core check (#134, #119 AC4 — load-bearing): the
      # paired proof that adding a third adapter left the neutral core untouched.
      # (A) workflow/** surfaces no Omnigent MECHANISM names — via the SHARED
      # lib-neutrality-scan.sh banned-token set (the Omnigent vocabulary was ADDED to that
      # one set, never forked into a second scanner — constitution P2), planted-token FAILS
      # / real-tree PASSES. (B) the Omnigent model-table vocabulary is confined to
      # adapters/omnigent/MODELS.md (model ids are extracted from MODELS.md at run time so
      # the list self-syncs, then sought across the adapter subtree + workflow/**),
      # planted-model-id FAILS / real-tree PASSES. Same "machinery proves it is live"
      # discipline as the reconcile/guard tests. Adapter-side (.claude/adapters/ + hooks/
      # are runtime bindings), so a CI change, not a workflow/** change — no constitution
      # P1 concern.
      - name: Omnigent neutral-core check
        run: bash .claude/hooks/omnigent-neutral-core.test.sh

      # Tasks-file resolution stays unambiguous (issue #21): the template skeleton
      # must never match the engine's specs/*/{spec,tasks}.md fallback globs, and no
      # task ID may appear in more than one live tasks file. Rule 3 (#69) also FAILs
      # on "done-but-unchecked" drift: a task left `- [ ]` after a commit carrying
      # its [T###] landed (it would mis-steer next-task selection).
      - name: Tasks-file consistency
        run: bash .claude/hooks/check-tasks-consistency.sh

      # Checkbox-drift regression tests (#69): rule 3 reads git log subjects, so
      # these throwaway-repo fixtures prove it fires on drift AND does not
      # false-fire on genuinely-unstarted tasks — the P2 "machinery proves it is
      # live" discipline, same as guard.test.sh.
      - name: Tasks-file consistency tests
        run: bash .claude/hooks/check-tasks-consistency.test.sh

      # T704 deterministic spec-content lint (#152, spec 002 US2.AC3): the
      # mechanizable half of the spec-quality gate. spec-lint.sh FAILs the
      # unambiguously-mechanizable spec smells over specs/*/spec.md — an empty AC
      # bullet, a US# with zero ACs, an AC duplicated verbatim within a story — so
      # the spec-quality [reviewer] (spec-quality-auditor, T701/T703) carries only
      # the SUBTLER judgment (the AGENTS.md-residency pattern: a deterministic
      # backstop with the auditor owning the subtle form; constitution P3 "add the
      # backstop"). The .test.sh proves the lint FIRES on each planted smell and
      # does NOT false-fire on a clean spec (incl. the live specs), AND that this
      # wiring exists — the P2 "machinery proves it is live" discipline, same as
      # shell-lint/guard. Adapter-side (hooks/ is the Claude Code binding), so a CI
      # change, not a workflow/** change — no constitution P1 concern.
      - name: Spec-content lint
        run: bash .claude/hooks/spec-lint.sh specs/*/spec.md

      - name: Spec-content lint tests
        run: bash .claude/hooks/spec-lint.test.sh

      # T608 selection reconciliation (#80): the RUNTIME counterpart of the tasks-consistency
      # drift gate. /next-task selection now refuses a candidate whose box is unchecked but
      # whose work has merged (done-but-unchecked drift), replacing the prose "cross-check
      # git/PRs" habit with a deterministic precondition (constitution P3). It SHARES
      # lib-tasks-drift.sh with check-tasks-consistency.sh rule 3 — one drift definition, two
      # consumers (the T602 anti-duplication lesson) — and fails open when git state is
      # unavailable. The .test.sh is a PAIRED harness: the same fixture SELECTS an open task
      # AND REFUSES a drifted one, so "no false positives" can't be met by a precondition that
      # never fires; it also asserts both consumers source the shared lib (done-when 4). The P2
      # "machinery proves it is live" discipline, same as guard.test.sh / check-tasks-consistency.
      - name: Selection-reconciliation tests
        run: bash .claude/hooks/reconcile-task-selection.test.sh

      # T614 selection announce-and-confirm (#103): the UX complement to the reconciliation
      # precondition above. After reconciliation resolves a candidate, /next-task announces the
      # resolved target and — only on an IMPLICIT pick contradicted by live state — PAUSES for
      # confirmation, a deterministic decision (constitution P3: a check, not the model
      # "noticing"). announce-task-selection.sh SHARES lib-tasks-drift.sh with the reconcile
      # precondition and the CI drift gate — one drift definition, three consumers — and fails
      # open to announce-only when git state is unreadable. The .test.sh is the same PAIRED
      # harness discipline as reconcile's: ONE fixture proves implicit-contradicted -> confirm,
      # implicit-consistent -> proceed (no false pause), and explicit -> proceed (never pauses),
      # so the pause is provably mode-AND-contradiction-gated; it also asserts the share-not-
      # duplicate sourcing and this wiring (P2 "machinery proves it is live").
      - name: Selection announce-and-confirm tests
        run: bash .claude/hooks/announce-task-selection.test.sh

      # T615 in-flight selection refusal (#105): the IN-FLIGHT half of live-state
      # reconciliation, the tracker-based companion to the git-only merged half above. After
      # the merged check clears a candidate, /next-task refuses one whose mapped issue has an
      # OPEN, unmerged PR/branch (work already in flight — invisible to a git-only commit-subject
      # scan). Necessarily a `gh` read, so it lives in the adapter (no `gh` in workflow/**, P1)
      # and FAILS OPEN to the merged-only result when gh/network is unavailable. The .test.sh
      # mocks gh on the script's `GH` seam: the same PAIRED harness discipline as reconcile's —
      # ONE tracker state REFUSES the in-flight task AND SELECTS a genuinely-open one (each arm,
      # PR and branch, exercised) — so "no false positive" can't be met by a check that never
      # fires; it also asserts this wiring (P2 "machinery proves it is live").
      - name: In-flight selection-reconciliation tests
        run: bash .claude/hooks/reconcile-inflight-selection.test.sh

      # [autonomy activation] (T610, epic #81): autonomy-mode.sh is the deterministic,
      # default-OFF activation decision for the [isolated workspace] role
      # (.claude/workflow/README.md). It is the deliberate INVERSE of guard.sh — it FAILS
      # CLOSED to review on any uncertainty, because a fail-open activation check would
      # silently switch autonomy on (constitution P3/P4; DESIGN-NOTES §13). The bare check
      # here is a liveness smoke: from the repo root it reads the shipped PROJECT.md, which
      # defaults to review. The .test.sh proves default-off + every fail-closed path AND that
      # this wiring exists (the P2 "machinery proves it is live" discipline, same as the
      # reconcile and residency checks above).
      - name: Autonomy-activation check (default-off smoke)
        run: bash .claude/hooks/autonomy-mode.sh

      - name: Autonomy-activation tests
        run: bash .claude/hooks/autonomy-mode.test.sh

      # T902 [backlog-loop] control skeleton (spec 004 US1.AC2/AC3): backlog-loop.sh is
      # the deterministic control skeleton for the bounded unattended loop
      # (.claude/workflow/backlog-loop.md, T901) — reachable ONLY through the
      # autonomy-mode.sh check above, consulted at the top of EVERY loop head and
      # failing CLOSED to review (AC2), with the closed stop-condition set evaluated
      # only BETWEEN iterations: max-N (N from the invocation, never hardcoded; N=0 is
      # a valid no-op), backlog-drained, same-identity-fails-gate-twice (first FAIL
      # advances one selection), and fail-closed (AC3). The selection/iteration
      # mechanisms are injectable seams with NO silent defaults (T905 binds the real
      # ones), so the .test.sh drives the skeleton with stub seams and proves every
      # stop condition, the activation ordering, and the shipped-profile default
      # (review, nothing runs) with exact-transcript assertions — the P2 "machinery
      # proves it is live" discipline, same as autonomy-mode.test.sh. Adapter-side
      # (hooks/ is the Claude Code binding), so a CI change, not a workflow/** change
      # — no constitution P1 concern.
      - name: Backlog-loop control tests
        run: bash .claude/hooks/backlog-loop.test.sh

      # T611 isolated-workspace lifecycle tests (#108, epic #81 part b):
      # isolated-workspace.sh binds the [isolated workspace] role's worktree enter/exit
      # lifecycle (.claude/workflow/README.md), and the next-task path wires T610's
      # [autonomy activation] read into it. The .test.sh proves the primitives behave (enter
      # creates an ephemeral worktree on a NON-base branch and prints its path; exit removes
      # it) AND the safety slice — enter->work->exit leaves the base ref untouched, so there
      # is no un-gated path to main through the lifecycle (the FULL falsification proof is the
      # next step, T613) — AND that this wiring is live (the P2 "machinery proves it is live"
      # discipline, same as the autonomy-mode/guard tests). Gate-in-place + promote/discard
      # landed in T612. Adapter-side (hooks/ is the Claude Code binding), so a CI change, not a
      # workflow/** change — no constitution P1 concern.
      - name: Isolated-workspace lifecycle tests
        run: bash .claude/hooks/isolated-workspace.test.sh

      # T613 isolation falsification proof (#115, epic #81 part d): the FULL adversarial proof
      # the lifecycle test above defers — it states the security claim (an un-gated change
      # cannot reach the base branch through the lifecycle) and TRIES to make it false, proving
      # each attempt fails: enter->commit->exit leaves the un-gated commit unreachable from base
      # (DW1); ->discard destroys it whole (DW2); a FORGED branch=main marker cannot make
      # discard delete the checked-out base (DW3); the script source carries no base-writing
      # door (DW4). Constitution P4 ("the isolation mechanism never writes the base branch
      # directly"). Its live counterpart — the P-IW conformance probe that the tier FIRES on a
      # real driver — is documented in workflow/conformance-probes.md + adapters/claude-code-
      # probes.md (the deterministic test and the live probe are complementary). P2 "machinery
      # proves it is live", same as the lifecycle/autonomy/guard tests; adapter-side CI change.
      - name: Isolation falsification proof
        run: bash .claude/hooks/isolation-falsification.test.sh

      # T903 backlog-loop multi-iteration falsification proof (spec 004 US1.AC4): extends the
      # T613 single-run proof above to the [backlog-loop]'s N-iteration case (backlog-loop.md →
      # "Safety invariants"). Drives the REAL isolated-workspace lifecycle through 3 sequential
      # mixed-outcome iterations (PASS→promote, FAIL→discard, PASS→promote) against ONE shared
      # base repo, planting the T613 adversarial un-gated commit in EVERY iteration, and proves:
      # the base ref stays byte-identical after every iteration and at run end; no merge lands
      # (exact rev-list count + explicit is-ancestor exit codes); every planted un-gated commit
      # stays unreachable from base — including from the DISCARDED iteration whose branch no
      # longer exists; and the terminal state is the PR queue's (promoted branches alive
      # un-merged, discarded branch gone). The T612 promotion path is unchanged and merge stays
      # session-explicit. P2 "machinery proves it is live", same as the isolation proof above;
      # adapter-side CI change, not a workflow/** change — no constitution P1 concern.
      - name: Backlog-loop multi-iteration falsification tests
        run: bash .claude/hooks/backlog-loop-falsification.test.sh

      # T622 review-mode gate branch-restore backstop (#140): in REVIEW mode the §7
      # [orchestrated run] dispatches the read-only auditors in the SHARED working tree, and
      # an auditor's Bash `git checkout`/`switch` can silently relocate the maker's HEAD off
      # the task branch (the #139 reflog drift). The gate-loop runtime has no git access, so
      # the deterministic restore lives in the dispatcher and is bound by restore-task-branch.sh
      # — a no-op when nothing drifted, fail-LOUD when it cannot guarantee the branch (the
      # inverse of the reconcile hooks' fail-open posture). The .test.sh is a real-git harness
      # encoding the done-when criteria: DW1 (an auditor's switch DID drift HEAD — fail-before —
      # and the helper restores it — pass-after, not a tautology), DW2 (after restore the
      # auditors' NON-SWITCHING base reads still return correct base content — no over-restriction),
      # and DW3 (the restore is exercised after BOTH a PASS-outcome and a FAIL-outcome branch
      # state). It also asserts the dispatcher actually invokes the helper (next-task SKILL.md)
      # and this CI wiring — the P2 "machinery proves it is live" discipline, same as
      # guard.test.sh. Adapter-side (hooks/ is the Claude Code binding), so a CI change, not a
      # workflow/** change — no constitution P1 concern.
      - name: Gate branch-restore backstop tests
        run: bash .claude/hooks/restore-task-branch.test.sh

      # AGENTS.md residency (#91): AGENTS.md is imported into every session
      # (CLAUDE.md -> @AGENTS.md), so it is the L1 "always resident" tier and its
      # size is a per-turn token tax on every task (DESIGN-NOTES §11). This check
      # FAILs if it grows past a line ceiling — the deterministic backstop
      # constitution P3 wants for a principle that was prose-only (#9). The
      # .test.sh proves the check fires AND is wired (the P2 "machinery proves it
      # is live" discipline, same as guard.test.sh).
      - name: AGENTS.md residency check
        run: bash .claude/hooks/agents-residency-check.sh

      - name: AGENTS.md residency tests
        run: bash .claude/hooks/agents-residency-check.test.sh

      # US6 intake/triage encoding tests (T501): the triage "Unmapped tracker
      # work" section + snapshot output shape (incl. the explicit empty state)
      # and intake's write-posture / retitle / marked-comment invariants. The
      # runtime-neutral workflow docs are the implementation surface; live
      # runtime conformance is the P-IN probe (conformance-probes.md).
      - name: Intake/triage encoding tests
        run: bash .claude/hooks/intake-docs.test.sh

      # T601 PR-review encoding tests (#53): the pr-review workflow doc's
      # grounding gate (no "no findings" without adjudicating every inline
      # comment and grounding each finding to current source), its role-neutrality
      # posture, the reconciliation-not-duplication with the review standard + §7
      # gate, and the skill binding's inline-comment fetch + additive-write
      # posture. Same rationale as the intake/triage encoding tests: the
      # runtime-neutral workflow doc is the implementation surface.
      - name: PR-review encoding tests
        run: bash .claude/hooks/pr-review-docs.test.sh

      # T302 retrospective skill-binding encoding tests (#72, US3.AC5): the
      # binding (.claude/skills/retrospective/SKILL.md) exposes the retrospective
      # workflow, dispatches the existing auditor roles READ-ONLY + report-only
      # (no fix loop), composes existing roles only (no new binding-contract row),
      # and dispatches the constitution auditor at-or-above the strong-tier floor
      # with the guard (rule 5) enforcing it — so the binding itself, not just the
      # neutral doc, is reviewed against the floor. The binding is the
      # implementation surface; this is the P3 determinism backstop for it (same
      # rationale as the pr-review/intake encoding tests). Adapter-side (the binding
      # may name mechanisms), so a CI change, not a workflow/** change — no
      # constitution P1 concern. The neutral doc's AC1–AC4 + neutrality grep are
      # T301's surface, covered by telemetry-docs.test.sh; the live conformance
      # probe is T303.
      - name: Retrospective encoding tests
        run: bash .claude/hooks/retrospective-docs.test.sh

      # T104 telemetry encoding tests (#52): the gate-run record's introducing-
      # commit ref (US1.AC5) — the field + its observe-only framing in telemetry.md,
      # the build/append split in gate-loop.md, the dispatcher's git-rev-parse
      # capture in the next-task binding, and the retrospective's deterministic
      # Fact B preference (with the stale "out of scope" disclaimer gone). Also
      # asserts no runtime-specific mechanism (GitHub CLI, model IDs) leaks into
      # the neutral docs — `git` is the harness's universal substrate, not banned.
      - name: Telemetry encoding tests
        run: bash .claude/hooks/telemetry-docs.test.sh

      # T634 effective-fix-rate tests (#209, spec 001 US9): the effective-fix rate —
      # flips (a reviewer FAIL that cleared to PASS/JUSTIFY on re-dispatch) over
      # FAIL-triggered re-dispatches — is a READ-ONLY derivation over the existing
      # gate-run records (no new record type/schema/writer). This test BOTH drives the
      # concrete recipe (.claude/hooks/effective-fix-rate.sh) over a PLANTED telemetry
      # stream, asserting the numerator/denominator EXACTLY per instance incl. both empty
      # states and the genuine-0-of-N distinction (US9.AC3), AND pins the neutral metric
      # definition (telemetry.md § Consumers) + the numerator/denominator render (triage.md
      # "Gate trends" + §4) + the observe-only framing (US9.AC1/AC2/AC4), with the
      # neutrality grep over the two neutral docs. Observe-only (constitution P5): the
      # recipe writes nothing and feeds no gate/tier/guard/selection path. Adapter-side
      # recipe + neutral-doc definition — the P3 determinism backstop for the derivation.
      - name: Effective-fix-rate tests
        run: bash .claude/hooks/effective-fix-rate.test.sh

      # T401 probe-fingerprint encoding tests (#85, US5.AC1): the conformance-probe
      # recording convention requires a content-hash fingerprint of the guard machinery
      # (guard script + hook wiring) recorded alongside probe results, so a later
      # freshness check (triage PROBES-STALE, T402) can tell when recorded results predate
      # a change to the guard the probes were meant to exercise. The wiring is hashed
      # because the matcher has been silently dead while guard.sh stayed correct (the
      # DESIGN-NOTES §"the guard was silently dead" class). The runtime-neutral doc + its
      # adapter instantiation are the implementation surface; this is the P3 determinism
      # backstop (same rationale as the other *-docs tests). The currency comparison is
      # T402's scope, and the live recompute is the probe run itself — not this test.
      - name: Probe-fingerprint encoding tests
        run: bash .claude/hooks/probe-fingerprint-docs.test.sh

      # T402 triage machinery-freshness encoding tests (#87, US5.AC2/AC3): triage
      # *consumes* the fingerprint T401 records — flag PROBES-STALE when the current
      # guard-machinery fingerprint differs from the last recorded probe run (+ report its
      # age), and flag GUARD-SILENT (heuristically, a warning not an error) when gate runs
      # occurred in the window but produced zero guard `evaluation` records. The
      # runtime-neutral doc (triage.md) + its Claude-adapter instantiation (triage/SKILL.md)
      # are the implementation surface; this is the P3 determinism backstop, same rationale
      # as the other *-docs tests. The live recompute/compare is the probe run + the §7
      # spec-auditor, not this test (the T401 recording side is probe-fingerprint-docs above).
      - name: Triage machinery-freshness encoding tests
        run: bash .claude/hooks/triage-freshness-docs.test.sh

      # T602 reviewer-roster drift backstop (#64, parent epic #62): the §7
      # reviewer set is declared once in gate-loop.md's roster table; this test
      # FAILs if the gate sites drift from it (gate-loop.md roster, the
      # gate-loop.js array, next-task.md §7 prose), the adapter's manual-fallback
      # [reviewer]→agent map (next-task SKILL.md, AC7) drops a reviewer, each roster
      # reviewer's spec exists, and each reviewer's agent file excludes edit tools. Same rationale
      # as the other *-docs tests: the runtime-neutral roster is the implementation
      # surface, and a roster with no live drift check is the very "silently dead
      # machinery" failure class (P2) this epic exists to prevent.
      - name: Reviewer-roster drift tests
        run: bash .claude/hooks/reviewer-roster.test.sh

      # T630 review-pass-roster drift + fence backstop (#194; US8.AC4+AC5): the
      # skill-backed review passes are an owner-editable `## Review passes` table in
      # the profile (T628) that every selection surface now reads (T629). This test
      # is the sibling of reviewer-roster.test.sh: it pins the profile rows against
      # the adapter-mapped shipped pass set (README role→mechanism table) — FAILing on
      # an enabled-but-unmapped row, an adapter-mapped pass missing from the profile
      # (the silent-drop parity gap), a duplicate row, or an off-enum
      # condition/applies-to — and fences the list against naming/disabling any §7
      # roster auditor (the set derived from gate-loop.md, so a future reviewer is
      # fenced too). Same "silently dead machinery" failure class (P2/P3) the roster
      # backstop guards, on the configurable-pass surface.
      - name: Review-pass-roster drift tests
        run: bash .claude/hooks/review-pass-roster.test.sh

      # T604 evasion-register encoding tests (#74): the register
      # (.claude/workflow/reviewers/evasion-register.md) is the cumulative cheat
      # museum the auditors consult at dispatch and the retrospective appends to via
      # PR. The runtime-neutral register + the auditor pointers + the retrospective
      # append-step + the P-EV probe ARE the implementation surface; this is the P3
      # determinism backstop (same rationale as the other *-docs tests), and it runs
      # the runtime-neutrality scan over the register itself. The live P-EV
      # demonstration (an auditor citing a seeded exhibit) is the probe run, recorded
      # in the adapter results table — not this test.
      - name: Evasion-register encoding tests
        run: bash .claude/hooks/evasion-register-docs.test.sh

      # Extraction manifest completeness (#90): .claude/EXTRACTION.md §2 is the
      # handoff cut-list for every tracked file in .claude/. A missing disposition
      # can drop a file during extraction or ship instance-stained material into a
      # template. This test compares the table to `git ls-files .claude` and fails
      # on a stale count, missing row, duplicate row, untracked row, invalid
      # category, or dead CI wiring. Source-only TEMPLATE rows explicitly marked
      # omit-only may be absent after extraction.
      - name: Extraction-manifest completeness
        run: bash .claude/hooks/extraction-manifest.test.sh

      # T605 auditor-liveness encoding tests (#75): the standing planted-violation
      # corpus that keeps the judgment auditors proven live — the model-driven analog
      # of guard.test.sh, promoted from the one-time P-RV probe. The runtime-neutral
      # methodology (.claude/workflow/auditor-liveness.md), the fixture manifest
      # (.claude/workflow/reviewers/auditor-liveness-corpus.md), the triage CORPUS-STALE
      # surfacing, and the skill binding ARE the implementation surface; the run itself
      # is model-driven + report-only (it cannot be a deterministic hard gate — a flaky
      # verdict would block honest work), so this is the P3 determinism backstop for the
      # corpus's SHAPE: it parses the manifest and FAILs if any auditor lacks its ≥1
      # expected-FAIL + ≥1 expected-PASS matched pair, plus the observe-only (P5) and the
      # P-RV/guard.test.sh-relationship done-when criteria. Same rationale as the other
      # *-docs tests. The live run's honesty is the §7 spec-auditor + a future probe.
      - name: Auditor-liveness encoding tests
        run: bash .claude/hooks/auditor-liveness-docs.test.sh

      # T801 maker-eval encoding tests (#155, spec 003 US1.AC1/AC4): the maker analog of
      # auditor-liveness — a frozen golden-task corpus that re-scores the MAKER (the generation
      # path) on a maker-behavior fingerprint change + weekly, observe-only. The runtime-neutral
      # methodology (.claude/workflow/maker-eval.md) + the frozen instrument
      # (.claude/workflow/reviewers/maker-eval-corpus.md) ARE the implementation surface; the run
      # itself is model-driven + report-only (it cannot be a deterministic hard gate — a flaky
      # verdict would block honest work), so this is the P3 determinism backstop for the corpus
      # SHAPE and the doc's triple-fingerprint / observe-only (P5) / PR-only (P4) contract: it
      # parses the corpus and FAILs if a task lacks a valid lifecycle tag or a rubric, the
      # lifecycle states are not all represented, or those sections drop — plus the neutrality
      # scan over both new neutral docs. Same rationale as the other *-docs tests. Record
      # emission (T802) and the deterministic P5 path-fence (T804) ship their own tests.
      - name: Maker-eval encoding tests
        run: bash .claude/hooks/maker-eval-docs.test.sh

      # T802 maker-eval record emitter (#157, spec 003 US1.AC2/AC3): where the docs test
      # above pins the corpus/doc SHAPE, this drives the concrete adapter emitter
      # (maker-eval-emit.sh) and proves its behavior — the maker analog of guard.test.sh
      # proving the telemetry emitter fires (P2 "machinery proven live"). It asserts the
      # triple fingerprint's three components move INDEPENDENTLY, that record appends one
      # JSONL line per corpus task with a packet fenced inside the channel, and the two
      # mandated cases: write-failure-stays-silent + partial-run-is-not-a-baseline.
      - name: Maker-eval emitter tests
        run: bash .claude/hooks/maker-eval-emit.test.sh

      # T803 triage "Maker eval" section (#159, spec 003 US2.AC2): triage *reads* the
      # observe-only records the T802 emitter writes and surfaces a read-only differential —
      # score regressions of the last COMPLETE run vs the prior under an explicit
      # noise-tolerant threshold (not "any delta"), link each regression's transcript packet,
      # flag MAKER-EVAL-STALE on a maker-behavior fingerprint change, suppress a confounded
      # comparison with JUDGE-CHANGED / INSTRUMENT-CHANGED, warn JUDGE-MISCALIBRATED below the
      # agreement floor, and render explicit empty states — observe-only (P5), triage runs no
      # eval and writes no record. The runtime-neutral doc (triage.md) + its Claude-adapter
      # instantiation (triage/SKILL.md) are the implementation surface; this is the P3
      # determinism backstop, same rationale as the other *-docs tests. The live differential's
      # honesty is the §7 spec-auditor + a future probe; the P5 path-fence is T804's.
      - name: Triage maker-eval surfacing encoding tests
        run: bash .claude/hooks/triage-maker-eval-docs.test.sh

      # T804 maker-eval P5 fence (#161, spec 003 US2.AC3): the DETERMINISTIC half of
      # constitution P5 for the maker-eval channel — where spec-001 telemetry leaves P5
      # to reviewer judgment, this proves it mechanically. maker-eval-fence.sh scans the
      # tracked tree for the eval channel's path/IO tokens (records.jsonl, packets/, the
      # MAKER_EVAL_* seam, the -maker-eval dir, the maker-eval-emit writer) and FAILs if
      # any appear outside the writer (maker-eval-emit.sh) / reader (triage/SKILL.md)
      # allowlist — so no gate/tier/guard/selection path can read or write the
      # observe-only channel. The .test.sh proves it FIRES on a planted cross-reference
      # to EITHER path across all four danger classes AND passes on the real tree (the P2
      # "machinery proves it is live" discipline, same as guard.test.sh). Adapter-side
      # (hooks/ is the Claude Code binding), so a CI change, not a workflow/** change — no
      # constitution P1 concern.
      - name: Maker-eval P5 fence
        run: bash .claude/hooks/maker-eval-fence.sh

      - name: Maker-eval P5 fence tests
        run: bash .claude/hooks/maker-eval-fence.test.sh

      # T904 backlog-loop run report (#229, spec 004 US1.AC6): the [backlog-loop]'s
      # observe-only run-report emitter (backlog-loop-report.sh) appends one line per
      # iteration — the task ID plus that iteration's terminal outcome in the outcome's
      # OWN form (a gated outcome's verdict + PR-ref-or-discard; a refused/aborted line
      # carries neither — never a fabricated gate result) — plus one terminal run-summary
      # line (stop condition + iterations-of-N, so a partial run is visible AS partial) to
      # the EXISTING out-of-repo telemetry stream (workflow/telemetry.md's storage
      # convention; no new path convention). The test proves FIELD FIDELITY (each written
      # field exactly equals the driven outcome, per line — not merely a well-formed
      # line), the no-fabrication arity rules, and that a write failure is
      # silent-to-the-run (exit 0, nothing written, caller unaffected).
      - name: Backlog-loop run-report tests
        run: bash .claude/hooks/backlog-loop-report.test.sh

      # T904 backlog-loop P5 fence (#229, spec 004 US1.AC5): the deterministic half of
      # constitution P5 for the run report — the sibling of the maker-eval fence above.
      # backlog-loop-fence.sh scans the tracked tree for the report's tokens (the two
      # record discriminators + the channel seam) and FAILs if any appear outside the
      # writer (backlog-loop-report.sh) / triage-reader allowlist — so no gate-outcome,
      # model-tier, task-selection, or guard path (nor the T905 loop skeleton, which is
      # line-scoped: it may DRIVE the writer but never read the report or feed iteration
      # counters back into control flow) can read the observe-only report. PAIRED with a
      # non-vacuity control: the fence itself FAILS if the writer or reader stops
      # resolving the channel. The .test.sh's first case runs the real fence over the
      # real tree, so this step enforces the fence AND proves it live (plant/pass/control
      # cases — the P2 "machinery proves it is live" discipline).
      - name: Backlog-loop P5 fence tests
        run: bash .claude/hooks/backlog-loop-fence.test.sh

      # T905 backlog-loop selection binding (#238, spec 004 US1.AC7): the real
      # BACKLOG_LOOP_SELECT_CMD — lowest-numbered unchecked task across the live
      # specs/*/tasks.md whose dependencies are met, excluding passed identities and
      # the profile/tasks-file blocked lists. The .test.sh proves every documented
      # selection rule against fixture trees (cross-file lowest-wins, whole-id
      # exclusion, blocked-bullet vs prose-mention discrimination, met/unmet
      # `Blocked by` ranges incl. the wrapped-continuation-line shape, drained ->
      # empty, unreadable backlog -> LOUD exit 1 fail-closed) — the P2 "machinery
      # proves it is live" discipline, same as backlog-loop.test.sh.
      - name: Backlog-loop selection binding tests
        run: bash .claude/hooks/backlog-loop-select.test.sh

      # T905 backlog-loop iteration binding (#238, spec 004 US1.AC7): the real
      # BACKLOG_LOOP_ITERATION_CMD — one fresh headless next-task cycle per
      # iteration, task ID explicit in the composed prompt (the explicit-context
      # rule), the outcome read from the run's OWN return via the terminal
      # BACKLOG-LOOP-OUTCOME marker (never a report file — constitution P5). The
      # .test.sh proves the prompt composition, verbatim outcome transport for the
      # whole grammar, and every fail-closed path (missing marker / unrecognized
      # outcome / non-zero run exit -> `aborted`; usage errors loud exit 2).
      - name: Backlog-loop iteration binding tests
        run: bash .claude/hooks/backlog-loop-iterate.test.sh

      # T905 backlog-loop launcher regression guard (#238, spec 004 US1; PR #239
      # review): docs/launchers/backlog-loop.sh is the [scheduled run] entry
      # (.claude/README.md role table), and its OWN logic — the auth preflight and
      # the --dangerously-skip-permissions composition — is covered by NONE of the
      # sibling hook tests. This drives the real launcher template against a stubbed
      # claude + loop skeleton and proves the fail-LOUD auth/permission behavior the
      # review flagged as untested: a missing token or missing claude is a
      # scheduler-visible exit 1 with the loop never reached (never an
      # unauthenticated run — the exact ca180d4 regression), the composed cycle
      # carries the permission bypass with the token exported, and a non-zero cycle
      # propagates its exit. The dead-man run-log line is asserted on every exit
      # path. P2 "machinery proves it is live", same as the sibling binding tests.
      - name: Backlog-loop launcher tests
        run: bash .claude/hooks/backlog-loop-launcher.test.sh

      # next-task.md budget (#93): .claude/workflow/next-task.md is the largest
      # methodology doc and the per-/next-task hub — new rules gravitate to it, so
      # it is the harness's accretion sink and sets the per-workflow context floor
      # (DESIGN-NOTES §11). This check FAILs if it grows past a line budget, forcing
      # a conscious "split into a sub-doc, or raise the bound in a reviewed PR"
      # decision instead of silent growth. A hard gate with headroom, not an exit-0
      # warning (an always-green warning is the P2 silently-dead anti-pattern). The
      # .test.sh proves it fires AND is wired (P2 "machinery proves it is live").
      - name: next-task.md budget check
        run: bash .claude/hooks/next-task-budget-check.sh

      - name: next-task.md budget tests
        run: bash .claude/hooks/next-task-budget-check.test.sh

      # T102 gate-loop encoding test (#65) — and any sibling .claude/workflows/
      # *.test.js. Until #65 these JS tests ran only by hand: verify had no node
      # step, so the gate-loop orchestration (one telemetry payload per gate run on
      # every return path, the fail-closed verdicts) could regress while CI stayed
      # green — the "silently dead machinery" class (P2; DESIGN-NOTES §"the guard
      # was silently dead"). The glob fails closed: zero matches is an error, so the
      # step can never silently run nothing. This is adapter-side wiring
      # (.claude/workflows/ is the Claude Code [orchestrated run] binding), so it is
      # a CI change, not a workflow/** change — no constitution P1 concern.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Workflow encoding tests (JS)
        run: |
          shopt -s nullglob
          tests=(.claude/workflows/*.test.js)
          if [ ${#tests[@]} -eq 0 ]; then
            echo "no .claude/workflows/*.test.js found — JS test wiring is dead" >&2
            exit 1
          fi
          for t in "${tests[@]}"; do
            echo "→ node $t"
            node "$t"
          done

      # T618 Omnigent [guard]/[edit guard] policy unit tests (#136, #119 AC2):
      # creance_omnigent/policies/guard.py ports the runtime-neutral [guard] rules
      # (workflow/README.md → "The [guard] rules") to Omnigent tool_call/tool_result
      # policies — deterministic, fail-open, with DENY cases for base-branch edits, bulk
      # staging (git add .), commit/push-to-base and base-refspec pushes, a passing control
      # (explicit-file staging), and a fail-open-on-exception assertion. Wired here so the
      # machinery is proven live, not silently dead (constitution P2; the SAME fail-closed
      # glob + per-file loop as the JS gate-loop tests above — zero matches is an error, so
      # the step can never silently run nothing). Adapter-side (.claude/adapters/omnigent/
      # is the Omnigent binding), so a CI change, not a workflow/** change — no constitution
      # P1 concern. Real-driver liveness (the P-* conformance probes) is deferred to T620.
      #
      # T619 (#139, #119 AC3) adds tests/test_reviewers.py — the cross-vendor + read-only +
      # [frontier]-pin check over reviewers/*.yaml — under the SAME test_*.py glob below, so
      # it rides this step with no wiring change (the glob, not a per-file list, is what
      # makes that safe; each test file also self-asserts this wiring).
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Omnigent adapter tests (Python — guard policies + reviewer config)
        run: |
          shopt -s nullglob
          tests=(.claude/adapters/omnigent/tests/test_*.py)
          if [ ${#tests[@]} -eq 0 ]; then
            echo "no .claude/adapters/omnigent/tests/test_*.py found — Python test wiring is dead" >&2
            exit 1
          fi
          for t in "${tests[@]}"; do
            echo "→ python3 $t"
            python3 "$t"
          done

